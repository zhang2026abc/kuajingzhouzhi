name: 部署网页

# ============================================================
#  跨境周知 · 把 app 目录发布成在线网页（GitHub Pages）
# ============================================================
#  触发时机：
#    - 每次 main 分支有推送（含每日抓取提交的内容）
#    - 也可以在 GitHub 网页上手动点「Run workflow」
#  部署完成后，访问地址为：
#    https://你的用户名.github.io/仓库名/
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，避免冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 app 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
