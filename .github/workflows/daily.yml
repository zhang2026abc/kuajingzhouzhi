name: 每日情报自动抓取

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 抓取并生成今日情报
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_PROVIDER: ${{ secrets.API_PROVIDER || 'zhipu' }}
        run: |
          python auto_fetch.py

      - name: 同步内容到网页目录
        run: |
          cp content.json app/content.json
          echo "已同步到 app/content.json"

      - name: 提交更新
        run: |
          git config user.name "跨境周知机器人"
          git config user.email "bot@users.noreply.github.com"

          for f in app/content.json content.json pending_news.json fetch.log; do
            [ -f "$f" ] && git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "今日内容无变化，跳过提交"
            exit 0
          fi

          git commit -m "🤖 每日情报自动更新 $(date -u '+%Y-%m-%d')"

          git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
          git push
          echo "✅ 已提交并推送"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log-${{ github.run_number }}
          path: |
            fetch.log
            pending_news.json
          retention-days: 7
          if-no-files-found: ignore
